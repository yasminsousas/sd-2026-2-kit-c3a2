services:
  

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  inferencia:
    build: ./inferencia
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OTEL_SERVICE_NAME=servico-inferencia
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - URL_INFERENCIA=${URL_INFERENCIA:-http://inferencia:8001}
      - TTL_RESULTADOS_SEG=${TTL_RESULTADOS_SEG:-3600}
      - OTEL_SERVICE_NAME=worker-inferencia
    depends_on:
      redis:
        condition: service_healthy
      inferencia:
        condition: service_started

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - URL_INFERENCIA=${URL_INFERENCIA:-http://inferencia:8001}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SEGREDO=${JWT_SEGREDO:-troque-este-segredo-super-seguro-32chars}
      - JWT_EXPIRACAO_MIN=${JWT_EXPIRACAO_MIN:-60}
      - USUARIO_PADRAO=${USUARIO_PADRAO:-admin}
      - SENHA_PADRAO=${SENHA_PADRAO:-admin123}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-30}
      - OTEL_SERVICE_NAME=api-gateway
    depends_on:
      redis:
        condition: service_healthy
      inferencia:
        condition: service_started