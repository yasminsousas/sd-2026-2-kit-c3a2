# Segredo de EXEMPLO. Os valores abaixo sao placeholders e NAO devem ir para
# producao. O recomendado e nao versionar segredos e cria-los direto no cluster:
#
#   kubectl -n plataforma-ia create secret generic plataforma-ia-segredos \
#     --from-literal=JWT_SEGREDO="$(openssl rand -hex 32)" \
#     --from-literal=SENHA_PADRAO='<senha-forte>' \
#     --from-literal=LLM_API_KEY='<chave-ou-vazio>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# (ou um gerenciador de segredos: Sealed Secrets, External Secrets, SOPS).
# Se o segredo for criado assim, remova secret.yaml do kustomization.yaml para
# o "kubectl apply -k" nao sobrescreve-lo com os placeholders.
#
# LLM_API_KEY vazio = LLM em modo simulado (nenhum dado sai do cluster).
apiVersion: v1
kind: Secret
metadata:
  name: plataforma-ia-segredos
  namespace: plataforma-ia
  labels:
    app.kubernetes.io/part-of: plataforma-ia
type: Opaque
stringData:
  JWT_SEGREDO: "TROQUE-ME-gere-com-openssl-rand-hex-32"
  SENHA_PADRAO: "TROQUE-ME"
  LLM_API_KEY: ""
