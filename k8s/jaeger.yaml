# Jaeger all-in-one: recebe spans via OTLP/HTTP (4318) e serve a UI (16686).
# Armazenamento em memoria: os traces somem ao reiniciar o pod (ok para estudo;
# em producao, usar um backend persistente com retencao definida).
# A UI NAO e exposta no Ingress; acesse com:
#   kubectl -n plataforma-ia port-forward svc/jaeger 16686:16686
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: plataforma-ia
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: plataforma-ia
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: plataforma-ia
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: plataforma-ia
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: plataforma-ia
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: MEMORY_MAX_TRACES
              value: "10000"
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
            - name: admin
              containerPort: 14269
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
