# CI/CD da plataforma.
#
# Em todo push e pull request:
#   1. testes      - testes unitarios (unittest, sem rede, sem Docker)
#   2. imagens     - builda as 4 imagens dos servicos e a imagem unica do Render
#   3. fumaca      - sobe a stack com docker compose e roda o teste ponta a ponta
# So em push na main (depois dos 3 acima passarem):
#   4. publicar    - publica as 4 imagens no GHCR (ghcr.io/<owner>/plataforma-ia-<servico>)
#
# Deploy: o Render publica sozinho a cada push na main (autoDeploy: true no
# render.yaml), buildando deploy/render/Dockerfile. Com o CI garantindo testes e
# build e o Render fazendo o deploy, o ciclo commit -> producao e automatico.
# Observacao: o autoDeploy do Render nao espera este workflow; um commit que
# quebre os testes ainda pode ser publicado. Para amarrar os dois, desligue o
# autoDeploy e chame o Deploy Hook do Render num job apos "publicar".
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo branch cancela a execucao antiga.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: python -m unittest discover -s tests -v

  imagens:
    name: Build da imagem ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: gateway
            dockerfile: servicos/gateway/Dockerfile
          - nome: inferencia
            dockerfile: servicos/inferencia/Dockerfile
          - nome: vetorial
            dockerfile: servicos/vetorial/Dockerfile
          - nome: worker
            dockerfile: servicos/worker/Dockerfile
          - nome: render
            dockerfile: deploy/render/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Contexto de build = raiz do repositorio (os Dockerfiles copiam servicos/comum)
      - name: docker build
        run: docker build -f ${{ matrix.dockerfile }} -t plataforma-ia-${{ matrix.nome }}:ci .

  fumaca:
    name: Teste de fumaca (docker compose)
    runs-on: ubuntu-latest
    needs: testes
    timeout-minutes: 20
    env:
      GATEWAY_URL: http://localhost:8000
      USUARIO: admin
      SENHA: admin123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias do script
        run: pip install -r requirements-dev.txt

      # --wait: so retorna quando os servicos com healthcheck estiverem saudaveis
      - name: Subir a stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Teste ponta a ponta
        run: python scripts/teste_ponta_a_ponta.py

      - name: Logs dos servicos (em caso de falha)
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

  publicar:
    name: Publicar ${{ matrix.nome }} no GHCR
    runs-on: ubuntu-latest
    needs: [testes, imagens, fumaca]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        nome: [gateway, inferencia, vetorial, worker]
    steps:
      - uses: actions/checkout@v4

      # O nome da imagem no GHCR precisa ser minusculo; o dono do repo pode nao ser.
      - name: Nome da imagem
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/plataforma-ia-${{ matrix.nome }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest para conveniencia e :<sha> para deploy reproduzivel (k8s/kustomization.yaml)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: servicos/${{ matrix.nome }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
