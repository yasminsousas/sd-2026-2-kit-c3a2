# Blueprint do Render: cria a plataforma inteira (plano gratis) a partir deste repositorio.
# Render Dashboard > New > Blueprint > selecione o repositorio. Passo a passo: deploy/INSTRUCOES.md

services:
  # gateway + inferencia + vetorial + worker (processos separados na mesma imagem; ver deploy/render/)
  - type: web
    name: plataforma-ia
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /saude
    autoDeploy: true            # CD: publica de novo a cada push na branch do blueprint
    envVars:
      - key: AMBIENTE
        value: producao         # exige JWT_SEGREDO forte
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: plataforma-ia-redis
          property: connectionString
      - key: JWT_SEGREDO
        generateValue: true     # o Render gera um segredo aleatorio (fora do codigo)
      - key: JWT_EXPIRACAO_MIN
        value: "60"
      - key: USUARIO_PADRAO
        value: admin
      - key: SENHA_PADRAO
        sync: false             # o Render pede para voce digitar no painel
      - key: RATE_LIMIT_RPM
        value: "30"
      - key: TTL_RESULTADOS_SEG
        value: "3600"
      - key: LLM_API_KEY        # opcional: vazio = LLM em modo simulado
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT   # opcional: ex. Grafana Cloud/Honeycomb (OTLP/HTTP)
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS    # opcional: credencial do coletor (ex. Authorization=Basic ...)
        sync: false

  # Filas e resultados (Redis gerenciado, gratis). So acessivel pela rede privada do Render.
  - type: keyvalue
    name: plataforma-ia-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction   # nao descartar mensagens da fila quando encher
    ipAllowList: []               # sem acesso externo
